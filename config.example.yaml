# ============================================================
# 剪贴板 -> 飞书多维表格 自动采集  配置模板（脱敏）
#
# 用法：复制本文件为 config.yaml，再填入你自己的飞书信息：
#     cp config.example.yaml config.yaml
#
# ⚠️ config.yaml 含你的 App Secret，已在 .gitignore 中，绝不会进 Git。
# ============================================================

feishu:
  # ---- 方式 A：自建飞书应用（推荐，可在任何机器运行，上传最快）----
  app_id: ''                # 飞书开放平台 -> 我的应用 -> 凭证与基础信息
  app_secret: ''            # 同上。留空则自动回退到方式 B
  # 该应用需要开通权限：bitable:app（多维表格）、drive:file（上传素材）
  # 并把该应用添加为多维表格的「可编辑」协作者

  # ---- 方式 B：复用已授权的 lark-cli 身份（app_secret 留空时自动生效）----
  lark_cli: ''              # lark-cli 可执行文件路径；留空 = 不用这种方式
  lark_cli_as: user

  # ---- 目标表 ----
  app_token: ''             # 多维表格 URL 中 /base/ 后面那段
  table_id: ''              # 表 URL 中 ?table= 后面那段
  view_id: ''               # 表 URL 中 &view= 后面那段
                            # ★ 必填：保证「找空白行」按界面从上到下的顺序，
                            #   不填会出现写入落行随机的问题

  # ---- 字段映射 ----
  # 左边 = 程序内部用的名字（不要改），右边 = 你表里的列名或字段 ID（fldXXXXXX）
  # 留空即表示同名。
  fields:
    终端名称: 终端名称
    第一屏: 第一屏
    第二屏: 第二屏
    第三屏: 第三屏
    第四屏: 第四屏
  #  街道/区名: 街道/区名      # 不需要时整行删掉或注释掉
  #  终端类型: 终端类型        # 不需要时整行删掉或注释掉

  # ---- 新建行时的默认值（不需要就删掉）----
  defaults: {}
  #  街道/区名: 某某区
  #  终端类型:
  #  - 网吧

  app_name: ''              # 选填：想让「文本」类型列显示别的名字时填它
  creator_user_id: ''       # 选填：飞书 open_id（ou_ 开头）。留空会自动取当前登录用户
  creator_field: 创建人      # 创建人写哪一列（一般不用改）

poll_interval_ms: 120       # 剪贴板轮询间隔（毫秒）
dedupe: true                # 同一张图 / 同一段文本连续重复则跳过
dedupe_window: 20           # 记住最近多少条内容的指纹

# ---------------- 性能 ----------------
perf:
  upload_workers: 3         # 同时上传几张图（同一单元格仍会串行避免互相覆盖）
optimize:                   # 大图压缩（只在超过 min_bytes 时才动，省上传流量）
  enabled: true
  min_bytes: 900000         # 小于 900KB 不处理，保证原图质量
  max_pixel: 1600           # 长边上限
  jpeg_quality: 85

# ---------------- 本地 OCR ----------------
ocr:
  engine: vision            # vision = macOS 系统内置 Vision（离线、中文准确、最快）
  langs: [zh-Hans, en-US]
  correction: false         # 关掉语言纠正，关键词命中更稳
  bin: bin/visionocr        # 单次模式可执行文件（回退用）
  worker: true              # 常驻 OCR 进程：模型只加载一次，之后每张约 0.2s
  worker_bin: bin/visionocr_worker
  # ⚠️ cpu_only 必须保持 false：常驻进程强制走 CPU 会 100% 返回空文本
  # （实测 60 张全空，每张 0.01s 根本没识别）—— 这是「跑一会儿就未识别」的根因
  cpu_only: false
  worker_max_jobs: 400      # 处理这么多张后主动换新进程，防状态累积；0 = 不轮换

# ---------------- 文本处理 ----------------
text:
  field: 终端名称           # 文本写入哪一列
  max_len: 60               # 超过长度视为误复制，跳过
  new_row: true             # 收到文本 = 新的一家店 -> 锁定到这一行，后续图片都归它
  row_selection: auto       # auto = 先找空白行，没有才新建；new = 总是新建；blank = 只写空白行
  blank_check_fields:       # 全空才算「空白行」
  - 终端名称
  - 第一屏
  - 第二屏
  - 第三屏
  - 第四屏
  blank_scan_limit: 600     # 最多扫描多少行（表很大时调大）

# ---------------- 图片 -> 屏位 判定规则 ----------------
# 按顺序逐条匹配，命中即停。mode=all 表示每组关键词都要出现，组内任一算命中。
# 下面这套是「网吧 / 电竞馆门店信息采集」场景的规则，按你自己的页面改。
rules:
- screen: 第一屏
  enabled: true
  mode: any
  keywords:
  - 营业中
  - 暂停营业
  - 休息中
  - 暂无营业
  - 开业
  exclude: []

  # 第四屏 = 同时有「高端外设专区」和「设备与服务」的页。
  # 必须排在第三屏之前，否则带「座区」字样的页会先被第三屏吃掉；
  # exclude 里的「收起」是为了避开第二屏的座区展开列表。
- screen: 第四屏
  enabled: true
  mode: all
  keywords:
  - - 高级外设专区
    - 高端外设专区
    - 外设高端专区
    - 外设专区
  - 设备与服务
  exclude:
  - 座区设备
  - 收起
- screen: 第二屏
  enabled: true
  mode: all
  keywords:
  - 设备与服务
  - - 收起
    - 收起へ
    - 收起∧
  exclude: []

- screen: 第三屏
  enabled: true
  mode: all
  keywords:
  - 设备与服务
  - - 座区
    - 座位专区
    - 座区设备
  exclude: []

  # 第四屏 = 兜底：前面都不命中时判它，不参与抢匹配。
  # keywords 留空 = 无条件兜底；填上词则需要命中其中一个。
  # OCR 一个字都没认出来的图仍然按未识别处理（存 unmatched/，不上传）。
- screen: 第四屏
  enabled: false
  fallback: true
  mode: any
  keywords: []
  exclude: []

# ---------------- 第二屏 / 第三屏 的区分（关键） ----------------
# 座区少、标签栏没有展开箭头时，第二屏（设备与服务主页）和第三屏（第一个座区）
# 长得一模一样，关键词分不开。所以改成按「本行里第几张设备与服务页」来分：
flow:
  enabled: true
  # duplicate_first（推荐）：本行第 1 张设备与服务页 -> 同时写第二屏和第三屏，
  #                          之后每张 -> 只写第三屏。两屏都不会错，也不会漏。
  # sequence：本行第 1 张只写第二屏，之后只写第三屏
  # off：完全靠关键词（容易串屏，不推荐）
  mode: duplicate_first
  trigger: [设备与服务]     # 命中这些词才进入顺序判定
  screens: [第二屏, 第三屏] # 第 1 张给第一个，之后给第二个
  skip_duplicate_if: [收起, 收起へ, 收起∧]

  # ---- 兜底守卫（修「序列页被误判成第四屏」）----
  # 某张序列页 OCR 没认出「设备与服务」时会掉进无条件兜底；守卫会先判断
  # 它像不像第四屏，不像就按序列续接，不再乱塞。
  fallback_guard: true
  guard_first_page: true    # 本行第 1 张设备页也纳入守卫
  # ⚠️ 这里**不能只写「外设」**：普通设备页里几乎都有「鼠标… 外设 游戏特权」
  #   这行字，写裸词会让每张设备页都被当成「像第四屏」，守卫直接失效。
  fourth_markers: [外设专区, 高端外设, 外设高端专区, 高级外设专区]
  sequence_hints: [设备与服务, 座区, 团购, 评价, 推荐, 订座, 总计, 总汁]

# ---------------- 本地图片缓存 ----------------
cache:
  auto_clean_days: 3        # 启动时自动删掉 3 天前的临时截图；0 = 不自动清

# ---------------- 行满策略 ----------------
limits:
  # 屏位满了之后又来同一屏位的图怎么办：
  #   skip（默认，跳过并提示先撤回再重传，不会偷偷新建行）
  #   new_row（新增一行再放；同一家店的图会传散，不推荐）
  overflow: skip
  per_screen_max:
    第一屏: 1
    第二屏: 1
    第三屏: 50
    第四屏: 1
  new_row_copy_fields: [终端名称]   # 换行时复制哪些字段到新行

# ---------------- 兜底 ----------------
fallback:
  require_text_first: true  # 没收到店名前的图片先进 pending，等文本建行后自动回灌
  unknown_name: ''          # 没文本就建行时，终端名称填什么（留空=空单元格）
  save_unmatched: true      # 未识别图片保存到 unmatched/

# ---------------- 界面 ----------------
ui:
  auto_start: true          # 打开面板就自动开始监听（关窗口即停，不留后台进程）
  web_url: ''               # 「打开当前行」用的地址，填你的多维表格链接
